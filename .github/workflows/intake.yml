{
  "concurrency": {
    "cancel-in-progress": false,
    "group": "omarchy-knowledge-native-writer",
    "queue": "max"
  },
  "jobs": {
    "build": {
      "if": "${{ github.repository_id == '1373429914' && github.repository == 'cylon58/omarchy-community-knowledge' && github.ref == 'refs/heads/main' && github.event.repository.default_branch == 'main' && github.event_name == 'pull_request_target' && github.event.pull_request.base.ref == 'main' && github.event.pull_request.base.repo.id == 1373429914 && github.event.pull_request.base.repo.full_name == 'cylon58/omarchy-community-knowledge' }}",
      "needs": "publish",
      "permissions": {
        "contents": "read"
      },
      "runs-on": "ubuntu-24.04",
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "fetch-depth": 1,
            "path": "toolkit",
            "persist-credentials": false,
            "ref": "c6805f52b3836766433c97a3781b957eae7f574a",
            "repository": "cylon58/omarchy-community-knowledge-tools"
          }
        },
        {
          "uses": "actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97",
          "with": {
            "python-version": "3.13"
          }
        },
        {
          "name": "Install fixed trusted runtime without a job token in the environment",
          "run": "python -m venv \"$RUNNER_TEMP/runtime\"\n\"$RUNNER_TEMP/runtime/bin/python\" -m pip install --disable-pip-version-check --only-binary=:all: --no-deps jsonschema==4.26.0 attrs==26.1.0 jsonschema-specifications==2025.9.1 referencing==0.37.0 rpds-py==2026.6.3\n\"$RUNNER_TEMP/runtime/bin/python\" -m pip install --disable-pip-version-check --no-build-isolation --no-deps ./toolkit\n"
        },
        {
          "name": "Provide official Ubuntu Arch version comparator for read-only refresh",
          "run": ". /etc/os-release\ntest \"$ID\" = ubuntu && test \"$VERSION_ID\" = 24.04\nsudo apt-get update\nsudo apt-get install --no-install-recommends -y makepkg libzstd1\ndpkg-query -W -f='${Package} ${Version}\\n' makepkg libzstd1\ntest \"$(/usr/bin/vercmp 1:1.0-1 1.0-1)\" = 1\ntest \"$(/usr/bin/vercmp 1.0-2 1.0-1)\" = 1\n"
        },
        {
          "uses": "actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c",
          "with": {
            "name": "knowledge-status-${{ github.run_id }}-${{ github.run_attempt }}",
            "path": "${{ runner.temp }}/status"
          }
        },
        {
          "env": {
            "GITHUB_TOKEN": "${{ github.token }}"
          },
          "name": "Build canonical snapshot",
          "run": "\"$RUNNER_TEMP/runtime/bin/python\" -I -m omarchy_knowledge.service build --deployment production --policy-revision c6805f52b3836766433c97a3781b957eae7f574a --toolkit-revision c6805f52b3836766433c97a3781b957eae7f574a --input \"$RUNNER_TEMP/status/status.json\" --output \"$RUNNER_TEMP/site\""
        },
        {
          "uses": "actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9",
          "with": {
            "name": "knowledge-pages-${{ github.run_id }}-${{ github.run_attempt }}",
            "path": "${{ runner.temp }}/site",
            "retention-days": 1
          }
        }
      ],
      "timeout-minutes": 15
    },
    "pages": {
      "environment": {
        "name": "github-pages",
        "url": "${{ steps.deployment.outputs.page_url }}"
      },
      "if": "${{ github.repository_id == '1373429914' && github.repository == 'cylon58/omarchy-community-knowledge' && github.ref == 'refs/heads/main' && github.event.repository.default_branch == 'main' && github.event_name == 'pull_request_target' && github.event.pull_request.base.ref == 'main' && github.event.pull_request.base.repo.id == 1373429914 && github.event.pull_request.base.repo.full_name == 'cylon58/omarchy-community-knowledge' }}",
      "needs": "build",
      "permissions": {
        "contents": "read",
        "id-token": "write",
        "pages": "write"
      },
      "runs-on": "ubuntu-24.04",
      "steps": [
        {
          "id": "deployment",
          "uses": "actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346",
          "with": {
            "artifact_name": "knowledge-pages-${{ github.run_id }}-${{ github.run_attempt }}"
          }
        }
      ],
      "timeout-minutes": 15
    },
    "plan": {
      "if": "${{ github.repository_id == '1373429914' && github.repository == 'cylon58/omarchy-community-knowledge' && github.ref == 'refs/heads/main' && github.event.repository.default_branch == 'main' && github.event_name == 'pull_request_target' && github.event.pull_request.base.ref == 'main' && github.event.pull_request.base.repo.id == 1373429914 && github.event.pull_request.base.repo.full_name == 'cylon58/omarchy-community-knowledge' }}",
      "permissions": {
        "contents": "read",
        "pull-requests": "read"
      },
      "runs-on": "ubuntu-24.04",
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "fetch-depth": 1,
            "path": "toolkit",
            "persist-credentials": false,
            "ref": "c6805f52b3836766433c97a3781b957eae7f574a",
            "repository": "cylon58/omarchy-community-knowledge-tools"
          }
        },
        {
          "uses": "actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97",
          "with": {
            "python-version": "3.13"
          }
        },
        {
          "name": "Install fixed trusted runtime without a job token in the environment",
          "run": "python -m venv \"$RUNNER_TEMP/runtime\"\n\"$RUNNER_TEMP/runtime/bin/python\" -m pip install --disable-pip-version-check --only-binary=:all: --no-deps jsonschema==4.26.0 attrs==26.1.0 jsonschema-specifications==2025.9.1 referencing==0.37.0 rpds-py==2026.6.3\n\"$RUNNER_TEMP/runtime/bin/python\" -m pip install --disable-pip-version-check --no-build-isolation --no-deps ./toolkit\n"
        },
        {
          "env": {
            "GITHUB_TOKEN": "${{ github.token }}"
          },
          "name": "Plan canonical snapshot",
          "run": "\"$RUNNER_TEMP/runtime/bin/python\" -I -m omarchy_knowledge.service plan --deployment production --policy-revision c6805f52b3836766433c97a3781b957eae7f574a --toolkit-revision c6805f52b3836766433c97a3781b957eae7f574a --output \"$RUNNER_TEMP/plan/plan.json\""
        },
        {
          "uses": "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a",
          "with": {
            "compression-level": 6,
            "if-no-files-found": "error",
            "name": "knowledge-plan-${{ github.run_id }}-${{ github.run_attempt }}",
            "path": "${{ runner.temp }}/plan/plan.json",
            "retention-days": 1
          }
        }
      ],
      "timeout-minutes": 15
    },
    "publish": {
      "if": "${{ github.repository_id == '1373429914' && github.repository == 'cylon58/omarchy-community-knowledge' && github.ref == 'refs/heads/main' && github.event.repository.default_branch == 'main' && github.event_name == 'pull_request_target' && github.event.pull_request.base.ref == 'main' && github.event.pull_request.base.repo.id == 1373429914 && github.event.pull_request.base.repo.full_name == 'cylon58/omarchy-community-knowledge' }}",
      "needs": "plan",
      "permissions": {
        "contents": "write",
        "pull-requests": "read"
      },
      "runs-on": "ubuntu-24.04",
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "fetch-depth": 1,
            "path": "toolkit",
            "persist-credentials": false,
            "ref": "c6805f52b3836766433c97a3781b957eae7f574a",
            "repository": "cylon58/omarchy-community-knowledge-tools"
          }
        },
        {
          "uses": "actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97",
          "with": {
            "python-version": "3.13"
          }
        },
        {
          "name": "Install fixed trusted runtime without a job token in the environment",
          "run": "python -m venv \"$RUNNER_TEMP/runtime\"\n\"$RUNNER_TEMP/runtime/bin/python\" -m pip install --disable-pip-version-check --only-binary=:all: --no-deps jsonschema==4.26.0 attrs==26.1.0 jsonschema-specifications==2025.9.1 referencing==0.37.0 rpds-py==2026.6.3\n\"$RUNNER_TEMP/runtime/bin/python\" -m pip install --disable-pip-version-check --no-build-isolation --no-deps ./toolkit\n"
        },
        {
          "uses": "actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c",
          "with": {
            "name": "knowledge-plan-${{ github.run_id }}-${{ github.run_attempt }}",
            "path": "${{ runner.temp }}/plan"
          }
        },
        {
          "env": {
            "GITHUB_TOKEN": "${{ github.token }}"
          },
          "name": "Publish canonical snapshot",
          "run": "\"$RUNNER_TEMP/runtime/bin/python\" -I -m omarchy_knowledge.service publish --deployment production --policy-revision c6805f52b3836766433c97a3781b957eae7f574a --toolkit-revision c6805f52b3836766433c97a3781b957eae7f574a --input \"$RUNNER_TEMP/plan/plan.json\" --output \"$RUNNER_TEMP/status/status.json\""
        },
        {
          "uses": "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a",
          "with": {
            "compression-level": 6,
            "if-no-files-found": "error",
            "name": "knowledge-status-${{ github.run_id }}-${{ github.run_attempt }}",
            "path": "${{ runner.temp }}/status/status.json",
            "retention-days": 1
          }
        }
      ],
      "timeout-minutes": 15
    }
  },
  "name": "Native snapshot intake",
  "on": {
    "pull_request_target": {
      "types": [
        "opened",
        "synchronize",
        "reopened"
      ]
    }
  },
  "permissions": {
    "contents": "read"
  }
}
